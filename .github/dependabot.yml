version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, go]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    labels: [dependencies, ci]
