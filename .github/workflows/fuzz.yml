name: fuzz

# Every Fuzz target in the module, each in its own job, for as long as the caller
# asks. Two callers ask differently and that is the only difference between them:
# verify.yml bounds the run so it can gate a merge, and fuzz-nightly.yml bounds it
# only by what a nightly can afford. Both legs exist because they answer different
# questions — "may this merge" and "is anything still hiding" — and #60's argument
# is that nightly alone would have let the math.MinInt32 defect merge and be found
# the next morning.
#
# It was written out twice, once per caller, and 55 of its 65 lines were identical:
# the target discovery, the three input guards and the crasher upload. The four
# real differences are the inputs below.

on:
  workflow_call:
    inputs:
      fuzztime:
        description: How long to fuzz each target, as a Go duration
        type: string
        default: 90s
      retention_days:
        description: How long to keep an uploaded crasher
        type: number
        default: 30

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: every Fuzz target in the module
        id: list
        # Discovered, not listed: a target added and not enrolled is a target
        # nobody fuzzes. An empty matrix is a failure for the same reason — it is
        # indistinguishable from a green run otherwise.
        run: |
          set -euo pipefail
          pairs=""
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              pairs="$pairs$pkg $target\n"
            done
          done
          matrix=$(printf '%b' "$pairs" | jq -Rsc '
            split("\n") | map(select(length > 0) | split(" ") | {package: .[0], target: .[1]})')
          echo "$matrix" | jq .
          if [ "$(echo "$matrix" | jq 'length')" -eq 0 ]; then
            echo "no Fuzz target found in the module"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: fuzz ${{ matrix.case.target }} for ${{ inputs.fuzztime }}
        # The three values below reach a shell. GitHub substitutes them textually
        # before bash parses the line, so an unchecked one is arbitrary execution
        # on the runner — fuzztime reaches here from a dispatch input, and the
        # matrix is built from `go test -list`, which reads the module. They go
        # through env: and are checked first, the guard record-corpus.yml carries.
        #
        # -run '^$' is required: without it the ordinary tests run first and spend
        # the budget before a single new input is generated.
        env:
          TARGET: ${{ matrix.case.target }}
          PACKAGE: ${{ matrix.case.package }}
          FUZZTIME: ${{ inputs.fuzztime }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$TARGET" | grep -qE '^Fuzz[A-Za-z0-9_]*$'; then
            echo "refusing '$TARGET': a fuzz target is Fuzz followed by Go identifier characters"
            exit 1
          fi

          # go list, which builds this matrix, emits full import paths — so the
          # shape to accept is this module's own path and nothing else. Anything
          # outside it is not a package this repository fuzzes.
          if ! printf '%s' "$PACKAGE" | grep -qE '^github\.com/galax-io/parsec(/[A-Za-z0-9_.-]+)*$'; then
            echo "refusing '$PACKAGE': a package is an import path inside this module"
            exit 1
          fi

          if ! printf '%s' "$FUZZTIME" | grep -qE '^[0-9]+[smh]$'; then
            echo "refusing '$FUZZTIME': a fuzz time is a number followed by s, m or h"
            exit 1
          fi

          go test -run '^$' -fuzz "^${TARGET}\$" -fuzztime "$FUZZTIME" "$PACKAGE"
      # A crasher is written to testdata/fuzz/<target>/ in the package directory and
      # the run fails. It is uploaded and never committed: the job is granted no write
      # permission, and the generated corpus lives in $GOCACHE and never reaches the
      # tree. The artefact is the whole reproduction, and it cannot be recovered from
      # a job that has been garbage-collected.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: crasher-${{ matrix.case.target }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}
