name: verify

# The gate set, defined once and called from both the pull-request path (ci.yml)
# and the release path (release.yml). Adding a gate means adding a job here and
# nowhere else: the caller reaches all of them through one `uses:` job, which
# fails when any job inside fails.
#
# Job names are a contract — see specs/001-ci-release-automation/contracts/workflows.md.

on:
  workflow_call:
    inputs:
      fuzz:
        description: >-
          Run the fuzzing leg. Pull requests only. Fuzzing is nondeterministic, so the
          same tree can pass one run and fail the next on a finding that depends on the
          seed; a release must not be gated on that, and the constitution's release rules
          leave no cheap way out of a tag blocked by chance. ci.yml turns it on for a pull
          request, release.yml leaves it off by taking the default.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # quick is the fast-fail gate: it must report within three minutes (SC-002), and
  # everything else runs behind it so a misformatted branch does not spend a runner
  # on the race detector.
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        # Asserted on empty output, not on exit status: `gofmt -l` exits 0 even when
        # it lists files, so the bare form reports success on exactly the input this
        # gate exists to reject.
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: the shell gates test themselves
        # These guard every release, and until now nothing guarded them: both
        # scripts/*_test.sh files were committed and run by no workflow, so a
        # regression in the machinery that gates a tag reached main unseen. It
        # did, twice.
        run: |
          set -euo pipefail
          for t in scripts/check-linkage_test.sh scripts/check-coverage_test.sh \
                   .claude/hooks/linkage-guard_test.sh .githooks/pre-push_test.sh; do
            echo "--- $t"
            bash "$t"
          done

  lint:
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # One run covers every build configuration: .golangci.yml sets
      # run.build-tags, so the integration and canary files are loaded too.
      # Without that they would be invisible to every linter and the job would
      # report an empty package — indistinguishable from clean code.
      - uses: golangci/golangci-lint-action@v9
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.12.2

  test:
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        run: go test -race -shuffle=on ./...

  e2e:
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: end-to-end over the golden corpus
        # shell: bash with pipefail, because a pipeline's status is its last
        # command's: under the default shell a failing test whose inventory is
        # satisfied would report green.
        #
        # -count=1 never serves a cached verdict for tests that read real recordings.
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(for pat in ./model/... ./gatling/...; do go list "$pat" 2>/dev/null || true; done)" ]; then
            echo "no decoder package yet; the end-to-end suite has nothing to run"
            exit 0
          fi
          # Not a pipeline into the inventory: `cmd | inventory || true` would take the
          # trailing `|| true` for the whole pipeline and discard the test result. The
          # status is checked on its own, and the inventory is the second reading.
          if ! go test -tags=integration -race -shuffle=on -count=1 -skip 'PeakMemory$' -json ./... > e2e.json; then
            jq -r 'select(.Action == "output") | .Output' e2e.json | grep -E 'FAIL|panic|\.go:[0-9]+:' | tail -60
            bash scripts/e2e-inventory.sh --summary < e2e.json || true
            exit 1
          fi
          bash scripts/e2e-inventory.sh --summary < e2e.json
      - name: bounded memory over a multi-gigabyte log
        # Apart from the step above, and without -race. The test decodes 2.8 GiB through
        # one reader in one goroutine, so the detector has nothing to observe; instrumenting
        # it costs about ninety seconds and moves the very HeapAlloc figure it asserts on.
        run: go test -tags=integration -count=1 -run 'PeakMemory$' ./...

  canary:
    needs: quick
    # A real Gatling, every supported version, against the probe simulation; the
    # decoder is held to each run's own report. See gatling-canary.yml.
    uses: ./.github/workflows/gatling-canary.yml

  # Every Fuzz target in the module, discovered rather than listed: a hard-coded
  # list silently stops covering a target added later, and FR-013 asks for every
  # one of them.
  fuzz-targets:
    if: inputs.fuzz
    needs: quick
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: every Fuzz target in the module
        id: list
        run: |
          set -euo pipefail
          pairs=""
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              pairs="$pairs$pkg $target\n"
            done
          done
          matrix=$(printf "$pairs" | jq -Rsc '
            split("\n") | map(select(length > 0) | split(" ") | {package: .[0], target: .[1]})')
          echo "$matrix" | jq .
          # Say so rather than passing quietly: a discovery step that found nothing
          # reads exactly like one that found everything and was satisfied.
          if [ "$(echo "$matrix" | jq 'length')" -eq 0 ]; then
            echo "no Fuzz target found in the module"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # One job per target, not one job running three.
  #
  # A single fuzzer saturates every core it is given — 862% CPU measured on a ten-core
  # machine — so three sharing a four-core runner would each get a third of the budget
  # the flag appears to grant.
  #
  # The budget is 90 s, from the report in #60 that FuzzDecode finds the math.MinInt32
  # crasher in about that. Measured here with a warm cache it took under 3 s, but that
  # is not the CI shape: a cold GOCACHE gives FuzzDecode 14 baseline inputs where a warm
  # one gave 147, and no generated corpus is committed. 90 s is the figure for the cold
  # case, and it is confirmed on the runner rather than inferred from a laptop.
  fuzz:
    if: inputs.fuzz
    needs: fuzz-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.fuzz-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: fuzz ${{ matrix.case.target }}
        # -run '^$' is required: without it the ordinary tests run first and spend
        # the budget before a single new input is generated.
        run: |
          set -euo pipefail
          go test -run '^$' -fuzz '^${{ matrix.case.target }}$' -fuzztime 90s '${{ matrix.case.package }}'
      # A crasher is written to testdata/fuzz/<target>/ in the package directory and
      # the run fails. It is uploaded and never committed: the job is granted no write
      # permission, and the generated corpus lives in $GOCACHE and never reaches the tree.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: crasher-${{ matrix.case.target }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: warn
          retention-days: 30

  # The corpus probe states what it must produce once, in an OpenNFR document, and
  # the Gatling assertions are rendered from it. This gate holds that document to
  # the schema OpenNFR publishes, so a schema change it violates is caught here
  # rather than by nobody.
  #
  # The ref is pinned to the release the renderer in gatling-picatinny tracks: the
  # document must satisfy the renderer first, and the schema at that ref is what
  # the renderer was built against. Moving the renderer's version moves this pin
  # with it, in the same change.
  nfr:
    needs: quick
    runs-on: ubuntu-latest
    env:
      OPENNFR_REF: v0.8.0
      DOCUMENT: testdata/corpus/gatling/simulation/src/test/resources/nfr.yaml
      MIRROR: specs/003-canonical-model/contracts/nfr.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: install the validator
        # Pinned for the same reason golangci-lint is: a validator that changes
        # under us turns a green gate red without a change to what it checks.
        run: pip install --disable-pip-version-check 'jsonschema==4.26.0' 'PyYAML==6.0.3'
      - name: fetch the published schema
        run: |
          set -euo pipefail
          curl -sfL --retry 3 \
            "https://raw.githubusercontent.com/galax-io/opennfr/${OPENNFR_REF}/schema/opennfr.io/v1/requirementset.schema.json" \
            -o /tmp/requirementset.schema.json
      - name: the spec's copy of the document matches the one the probe runs
        # The contract mirrors the document so a reader of the spec need not open
        # the corpus tree. Two copies drift; this is what stops them.
        run: |
          set -euo pipefail
          test -f "$MIRROR" || { echo "no mirror at $MIRROR"; exit 1; }
          diff -u "$MIRROR" "$DOCUMENT"
      - name: the probe's requirements validate against it
        # A gate that cannot find its input reports failure rather than success:
        # a missing document reads exactly like a valid one to a bare exit code.
        run: |
          set -euo pipefail
          test -f "$DOCUMENT" || { echo "no document at $DOCUMENT"; exit 1; }
          python3 - "$DOCUMENT" <<'PYEOF'
          import json, sys
          import yaml
          from jsonschema import Draft202012Validator

          path = sys.argv[1]
          with open("/tmp/requirementset.schema.json") as f:
              schema = json.load(f)
          with open(path) as f:
              document = yaml.safe_load(f)

          errors = sorted(Draft202012Validator(schema).iter_errors(document),
                          key=lambda e: list(e.path))
          for e in errors:
              where = "/".join(str(p) for p in e.path) or "(root)"
              print(f"{path}: {where}: {e.message}")

          if errors:
              sys.exit(1)

          print(f"{path}: valid against the OpenNFR schema")
          PYEOF

  deps:
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: model and gatling depend on the standard library only
        run: |
          set -euo pipefail
          seen=0
          for pkg in ./model/... ./gatling/...; do
            if go list "$pkg" >/dev/null 2>&1; then
              seen=1
              # A dependency is third-party when it is neither the standard library nor one
              # of this module's own packages; a path pattern cannot tell those apart, and
              # `go list -deps` prints the queried package itself.
              deps=$(go list -deps -f '{{if not .Standard}}{{if not .Module.Main}}{{.ImportPath}}{{end}}{{end}}' "$pkg")
              if [ -n "$deps" ]; then
                echo "non-stdlib dependency found in $pkg:"
                echo "$deps"
                exit 1
              fi
            fi
          done
          # Say so rather than passing quietly: a gate that silently checked nothing
          # reads exactly like a gate that checked everything and was satisfied.
          if [ "$seen" -eq 0 ]; then
            echo "neither model/ nor gatling/ exists yet; the boundary check had nothing to check"
          fi

  vuln:
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        # Run through go run at a pinned version so the tool never reaches go.mod.
        # renovate: datasource=go depName=golang.org/x/vuln
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  coverage:
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: coverage floors — 90% per decoder package, 80% overall
        # --enforce is passed: the constitution's recorded follow-up was to make the
        # floors blocking once the first decoder package landed, and it has.
        run: |
          set -euo pipefail
          go test -tags=integration -count=1 -skip 'PeakMemory$' \
            -coverpkg=./... -coverprofile=cover.out ./...
          bash scripts/check-coverage.sh --enforce cover.out
