name: gatling-canary

# Runs a real Gatling — every version in the list, each in its own job — against the
# probe simulation and holds the decoder to the report each run generated for itself;
# then one job holds the runs to each other. The recorded corpus proves the decoder
# against the past; this proves it against a Gatling that ran a minute ago.
#
# Both formats. Until v0.0.7 the list was 3.11.5 and 3.12.0, both text, so the binary
# codec — the newer half, and the one that shipped a panic in v0.0.5 — was never run
# against a live Gatling at all. The version list is now every version in both
# supported ranges, and each codec's canary takes the runs whose log it reads and
# leaves the rest to the other, asking the log rather than the version.

on:
  workflow_call:
    inputs:
      versions:
        description: Gatling versions to run, as a JSON list
        type: string
        default: '["3.11.5", "3.12.0", "3.13.1", "3.14.9", "3.15.1"]'
  workflow_dispatch:
    inputs:
      versions:
        description: >-
          Gatling versions to run, as a JSON list. A version above the supported range
          decodes unverified and is reported as a candidate for widening the range.
        type: string
        default: '["3.11.5", "3.12.0", "3.13.1", "3.14.9", "3.15.1"]'
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

env:
  SIMULATION: testdata/corpus/gatling/simulation

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gatling: ${{ fromJSON(inputs.versions || '["3.11.5", "3.12.0", "3.13.1", "3.14.9", "3.15.1"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9
      # Keyed on the Gatling version, which setup-java's own sbt cache cannot see:
      # it hashes the build files, and those are identical across the matrix because
      # the version arrives as -Dgatling.version. Both legs would key alike, only one
      # could save, and the other would re-resolve its Gatling on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
          key: sbt-${{ runner.os }}-${{ matrix.gatling }}-${{ hashFiles('**/*.sbt', '**/project/**') }}
          restore-keys: |
            sbt-${{ runner.os }}-${{ matrix.gatling }}-
      - name: start the stub the probe simulation talks to
        # Build first: on a cold runner "go run" spends longer compiling than any
        # sensible wait for the port, and the wait would time out on the compiler.
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/stub" ./testdata/corpus/gatling/simulation/stub
          "$RUNNER_TEMP/stub" > "$RUNNER_TEMP/stub.log" 2>&1 &
          for _ in $(seq 1 150); do
            curl -sf http://127.0.0.1:8089/ok > /dev/null && exit 0
            sleep 0.2
          done
          echo "the stub did not come up within 30 s"
          cat "$RUNNER_TEMP/stub.log"
          exit 1
      - name: run the probe simulation under Gatling ${{ matrix.gatling }}
        working-directory: ${{ env.SIMULATION }}
        # matrix.gatling comes from inputs.versions on a dispatch. GitHub
        # substitutes it textually before bash parses the line, so an unchecked
        # value is arbitrary execution on the runner and an arbitrary path below
        # — the guard record-corpus.yml already carries, for the same value.
        env:
          GATLING: ${{ matrix.gatling }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$GATLING" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refusing '$GATLING': a Gatling version is three dot-separated numbers"
            exit 1
          fi

          if ! sbt -batch -Dgatling.version="$GATLING" "Gatling/testOnly io.galaxio.parsec.corpus.CorpusSimulation"; then
            echo "canary: Gatling $GATLING could not run the probe simulation"
            exit 1
          fi

          mv "$(ls -d target/gatling/corpussimulation-* | head -1)" "target/gatling/v$GATLING"
      - name: decode the fresh run and hold it to its own report
        env:
          PARSEC_CANARY_RUNS: ${{ matrix.gatling }}=${{ github.workspace }}/${{ env.SIMULATION }}/target/gatling/v${{ matrix.gatling }}
          # One version at a time here by construction, so the range gate stands
          # down: it belongs to the compare job, which sees every run at once.
          PARSEC_CANARY_PARTIAL: '1'
          GATLING: ${{ matrix.gatling }}
        run: |
          set -euo pipefail
          echo "## Gatling canary — $GATLING" >> "$GITHUB_STEP_SUMMARY"
          if ! go test -tags=canary -race -count=1 -run '^TestCanary$' -json ./gatling/text/ ./gatling/binary/ > canary.json; then
            jq -r 'select(.Action == "output") | .Output' canary.json | grep -E 'FAIL|Gatling|\.go:[0-9]+:' | tail -60
            exit 1
          fi
          passed=$(jq -r 'select(.Action == "pass" and .Test != null) | .Test' canary.json | wc -l | tr -d ' ')
          echo "canary tests passed: $passed"
          if [ "$passed" -eq 0 ]; then
            echo "no canary test ran"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gatling-run-${{ matrix.gatling }}
          path: ${{ env.SIMULATION }}/target/gatling/v${{ matrix.gatling }}
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gatling-run-*
          path: runs
      - name: hold every fresh run to every other
        run: |
          set -euo pipefail
          runs=""
          for dir in runs/gatling-run-*; do
            v=${dir#runs/gatling-run-}
            runs="${runs:+$runs;}$v=$PWD/$dir"
          done
          echo "## Gatling canary — across versions" >> "$GITHUB_STEP_SUMMARY"
          export PARSEC_CANARY_RUNS="$runs"
          # A dispatch naming a chosen subset is not the gate that holds the
          # supported range to the canary — asking for one version to debug it
          # must not red the build for the four it did not ask for.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            export PARSEC_CANARY_PARTIAL=1
          fi
          if ! go test -tags=canary -race -count=1 \
            -run '^TestCanary(CrossVersion|CrossFormat|CoversSupportedRange|RefusesAVersionBelowTheRange)$' \
            -json ./gatling/text/ ./gatling/binary/ > compare.json; then
            jq -r 'select(.Action == "output") | .Output' compare.json | grep -E 'FAIL|Gatling|\.go:[0-9]+:' | tail -60
            exit 1
          fi
          passed=$(jq -r 'select(.Action == "pass" and .Test != null) | .Test' compare.json | wc -l | tr -d ' ')
          echo "comparison tests passed: $passed"
          if [ "$passed" -eq 0 ]; then
            echo "no comparison test ran"
            exit 1
          fi
