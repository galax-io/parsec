name: gatling-canary

# Runs a real Gatling — every version in the list, each in its own job — against the
# probe simulation and holds the decoder to the report each run generated for itself;
# then one job holds the runs to each other. The recorded corpus proves the decoder
# against the past; this proves it against a Gatling that ran a minute ago.

on:
  workflow_call:
    inputs:
      versions:
        description: Gatling versions to run, as a JSON list
        type: string
        default: '["3.11.5", "3.12.0"]'
  workflow_dispatch:
    inputs:
      versions:
        description: >-
          Gatling versions to run, as a JSON list. A version above the supported range
          decodes unverified and is reported as a candidate for widening the range.
        type: string
        default: '["3.11.5", "3.12.0"]'
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

env:
  SIMULATION: testdata/corpus/gatling/simulation

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gatling: ${{ fromJSON(inputs.versions || '["3.11.5", "3.12.0"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      # Keyed on the Gatling version, which setup-java's own sbt cache cannot see:
      # it hashes the build files, and those are identical across the matrix because
      # the version arrives as -Dgatling.version. Both legs would key alike, only one
      # could save, and the other would re-resolve its Gatling on every run.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
          key: sbt-${{ runner.os }}-${{ matrix.gatling }}-${{ hashFiles('**/*.sbt', '**/project/**') }}
          restore-keys: |
            sbt-${{ runner.os }}-${{ matrix.gatling }}-
      - name: start the stub the probe simulation talks to
        # Build first: on a cold runner "go run" spends longer compiling than any
        # sensible wait for the port, and the wait would time out on the compiler.
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/stub" ./testdata/corpus/gatling/simulation/stub
          "$RUNNER_TEMP/stub" > "$RUNNER_TEMP/stub.log" 2>&1 &
          for _ in $(seq 1 150); do
            curl -sf http://127.0.0.1:8089/ok > /dev/null && exit 0
            sleep 0.2
          done
          echo "the stub did not come up within 30 s"
          cat "$RUNNER_TEMP/stub.log"
          exit 1
      - name: run the probe simulation under Gatling ${{ matrix.gatling }}
        working-directory: ${{ env.SIMULATION }}
        run: |
          set -euo pipefail
          if ! sbt -batch -Dgatling.version="${{ matrix.gatling }}" "Gatling/testOnly io.galaxio.parsec.corpus.CorpusSimulation"; then
            echo "canary: Gatling ${{ matrix.gatling }} could not run the probe simulation"
            exit 1
          fi
          mv "$(ls -d target/gatling/corpussimulation-* | head -1)" "target/gatling/v${{ matrix.gatling }}"
      - name: decode the fresh run and hold it to its own report
        env:
          PARSEC_CANARY_RUNS: ${{ matrix.gatling }}=${{ github.workspace }}/${{ env.SIMULATION }}/target/gatling/v${{ matrix.gatling }}
        run: |
          set -euo pipefail
          echo "## Gatling canary — ${{ matrix.gatling }}" >> "$GITHUB_STEP_SUMMARY"
          if ! go test -tags=canary -race -count=1 -run '^TestCanary$' -json ./gatling/text/ > canary.json; then
            jq -r 'select(.Action == "output") | .Output' canary.json | grep -E 'FAIL|Gatling|\.go:[0-9]+:' | tail -60
            exit 1
          fi
          passed=$(jq -r 'select(.Action == "pass" and .Test != null) | .Test' canary.json | wc -l | tr -d ' ')
          echo "canary tests passed: $passed"
          if [ "$passed" -eq 0 ]; then
            echo "no canary test ran"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: gatling-run-${{ matrix.gatling }}
          path: ${{ env.SIMULATION }}/target/gatling/v${{ matrix.gatling }}
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          pattern: gatling-run-*
          path: runs
      - name: hold every fresh run to every other
        run: |
          set -euo pipefail
          runs=""
          for dir in runs/gatling-run-*; do
            v=${dir#runs/gatling-run-}
            runs="${runs:+$runs;}$v=$PWD/$dir"
          done
          echo "## Gatling canary — across versions" >> "$GITHUB_STEP_SUMMARY"
          export PARSEC_CANARY_RUNS="$runs"
          if ! go test -tags=canary -race -count=1 -run '^TestCanary(CrossVersion|CoversSupportedRange)$' -json ./gatling/text/ > compare.json; then
            jq -r 'select(.Action == "output") | .Output' compare.json | grep -E 'FAIL|Gatling|\.go:[0-9]+:' | tail -60
            exit 1
          fi
          passed=$(jq -r 'select(.Action == "pass" and .Test != null) | .Test' compare.json | wc -l | tr -d ' ')
          echo "comparison tests passed: $passed"
          if [ "$passed" -eq 0 ]; then
            echo "no comparison test ran"
            exit 1
          fi
