name: ci

# Three jobs, and the gates are not among them: they live in verify.yml and reach
# here as one `uses:` job, because `needs:` accepts only job ids declared in the
# same file and a reusable workflow's jobs are not addressable from its caller.
#
#   changes ──→ gates (uses: verify.yml)
#      │            │
#      └────────────┴──→ verify   (if: always())
#
# There is no paths-ignore. When paths-ignore matches, GitHub does not run the
# workflow at all, so a required check never reports and a documentation-only pull
# request is blocked forever. The changes job is what lets a docs change merge while
# a code change is still gated.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit is not in a default depth-1 clone, and `git diff` against
          # an object it does not have exits 128.
          fetch-depth: 0
      - id: filter
        name: does this change touch code?
        env:
          # Event-specific: this workflow runs on both, and the pull-request field is
          # empty on a push. Reading only that one would mark every trunk push
          # documentation-only and report green having verified nothing.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # An all-zero SHA is how a first push and a branch creation are reported.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "base commit could not be resolved; treating the change as code"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE" "$HEAD_SHA")"
          echo "changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          # Documentation-only when every changed path is prose or spec material.
          # Guessing wrong in this direction costs a review; guessing wrong the other
          # way lets an unverified change through, which is why anything unrecognised
          # counts as code.
          if printf '%s\n' "$changed" | grep -qvE '(\.md$|^docs/|^specs/|^\.specify/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "documentation only; the code gates have nothing to verify"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  gates:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The only `if:` on the gate set. The jobs inside verify.yml cannot see
    # needs.changes and must not try.
    uses: ./.github/workflows/verify.yml

  # The single required status check. One entry carries the whole gate set, so
  # adding a gate is an edit to verify.yml alone.
  verify:
    needs: [changes, gates]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verdict
        env:
          CHANGES: ${{ needs.changes.result }}
          GATES: ${{ needs.gates.result }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          echo "changes: $CHANGES"
          echo "gates:   $GATES"

          # skipped is a pass: it is how a documentation-only change reports.
          # cancelled is not — an author may suppress a run, but suppressing is not
          # passing, and a superseded run must never read as a green one.
          if [ "$FAILED" = "true" ]; then
            echo "a gate failed"
            exit 1
          fi
          if [ "$CANCELLED" = "true" ]; then
            echo "the run was cancelled, which is not a pass"
            exit 1
          fi
