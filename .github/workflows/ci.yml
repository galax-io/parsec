name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'specs/**', '.specify/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'specs/**', '.specify/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: test
        run: go test -race -shuffle=on ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: end-to-end over the golden corpus
        # An empty run fails: once a decoder package exists, at least one integration test
        # must have run and passed. -count=1 never serves a cached verdict for tests that
        # read real recordings.
        run: |
          set -euo pipefail
          if [ -z "$(for pat in ./model/... ./gatling/...; do go list "$pat" 2>/dev/null || true; done)" ]; then
            echo "no decoder package yet; the end-to-end suite has nothing to run"
            exit 0
          fi
          if ! go test -tags=integration -race -shuffle=on -count=1 -json ./... > e2e.json; then
            jq -r 'select(.Action == "output") | .Output' e2e.json | grep -E 'FAIL|panic|\.go:[0-9]+:' | tail -60
            exit 1
          fi
          passed=$(jq -r 'select(.Action == "pass" and .Test != null) | .Test' e2e.json | wc -l | tr -d ' ')
          echo "integration tests passed: $passed" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$passed" -eq 0 ]; then
            echo "no integration test ran: the corpus is missing, not optional"
            exit 1
          fi

  canary:
    # A real Gatling, every supported version, against the probe simulation; the
    # decoder is held to each run's own report. See gatling-canary.yml.
    uses: ./.github/workflows/gatling-canary.yml

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: model and gatling depend on the standard library only
        run: |
          set -euo pipefail
          for pkg in ./model/... ./gatling/...; do
            if go list "$pkg" >/dev/null 2>&1; then
              # A dependency is third-party when it is neither the standard library nor one
              # of this module's own packages; a path pattern cannot tell those apart.
              deps=$(go list -deps -f '{{if not .Standard}}{{if not .Module.Main}}{{.ImportPath}}{{end}}{{end}}' "$pkg")
              if [ -n "$deps" ]; then
                echo "non-stdlib dependency found in $pkg:"
                echo "$deps"
                exit 1
              fi
            fi
          done

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        # Run through go run at a pinned version so the tool never reaches go.mod.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: coverage floors — 90% per decoder package, 80% overall
        run: |
          set -euo pipefail
          pkgs=$(for pat in ./model/... ./gatling/...; do go list "$pat" 2>/dev/null || true; done)
          if [ -z "$pkgs" ]; then
            echo "no decoder package yet; nothing to hold to the 90% floor"
            exit 0
          fi
          {
            echo "| package | coverage | floor |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for pkg in $pkgs; do
            pct=$(go test -tags=integration -count=1 -cover "$pkg" | sed -nE 's/.*coverage: ([0-9.]+)% of statements.*/\1/p' | tail -1)
            echo "$pkg: ${pct:-0}%"
            echo "| $pkg | ${pct:-0}% | 90% |" >> "$GITHUB_STEP_SUMMARY"
            awk -v p="${pct:-0}" -v pkg="$pkg" 'BEGIN { if (p + 0 < 90) { print pkg " coverage " p "% is below the 90% floor"; exit 1 } }'
          done
          go test -tags=integration -count=1 -coverpkg=./... -coverprofile=cover.out ./... > /dev/null
          overall=$(go tool cover -func=cover.out | awk '/^total:/ { sub("%", "", $NF); print $NF }')
          echo "overall: ${overall}%"
          echo "| overall | ${overall}% | 80% |" >> "$GITHUB_STEP_SUMMARY"
          awk -v p="$overall" 'BEGIN { if (p + 0 < 80) { print "overall coverage " p "% is below the 80% floor"; exit 1 } }'
